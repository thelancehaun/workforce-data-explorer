# Keeps the free-tier Render MCP server from spinning down (idle timeout ~15
# min) so connector users never hit a 30-60s cold start. One always-on service
# fits within Render's 750 free instance-hours/month.
name: Keep MCP server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # GitHub throttles this cron to every 1-3h in practice, so most pings
        # hit a sleeping instance. A cold boot takes 45-75s and can outlive a
        # single request at Render's proxy — retry for up to ~4 minutes so a
        # slow wake still counts (and actually wakes the server).
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://workforce-data-mcp.onrender.com/healthz || echo 000)
            echo "attempt $i: healthz -> HTTP $code"
            test "$code" = "200" && exit 0
          done
          exit 1
